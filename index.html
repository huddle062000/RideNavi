<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>Ride Navi 2.5.20 β</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css?v=2.5.19">
</head>
<body>
  <main id="app">
    <div id="map"></div>

    <header id="searchBar" class="search-bar">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="destinationInput" type="search" placeholder="目的地を検索" autocomplete="off" aria-label="目的地を検索">
    </header>

    <section id="destinationPanel" class="bottom-sheet destination-sheet" hidden aria-label="目的地とルート条件">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="destination-heading">
        <div class="destination-details">
          <strong id="destinationName">選択した目的地</strong>
          <span id="destinationCategory" class="destination-category" hidden></span>
          <span id="destinationBusinessInfo" class="destination-business-info" hidden></span>
        </div>
        <button id="clearDestinationButton" class="destination-close" type="button" aria-label="目的地を解除">×</button>
      </div>
      <span id="destinationAddress" class="visually-hidden">地図上の地点</span>
      <fieldset class="road-mode-group">
        <legend>道路タイプ</legend>
        <label><input type="radio" name="destinationRouteMode" value="local" checked><span>一般道</span></label>
        <label><input type="radio" name="destinationRouteMode" value="partial"><span>一部有料</span></label>
        <label><input type="radio" name="destinationRouteMode" value="highway"><span>高速道路</span></label>
      </fieldset>
      <div class="destination-actions" aria-label="目的地の操作">
        <button id="routeButton" class="primary-action" type="button">経路</button>
        <button id="destinationNavigationButton" type="button">ナビ開始</button>
        <button id="destinationShareButton" type="button">共有</button>
      </div>
      <small id="destinationAttribution" class="destination-attribution" hidden></small>
    </section>

    <section id="routeSummaryPanel" class="bottom-sheet route-summary-panel" hidden aria-label="選択中のルート情報">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="route-summary-title">
        <strong id="routeSummaryRoadType">一般道</strong>
        <span id="routeSummarySelection">選択中 ①</span>
        <span id="routeSummaryToll" hidden></span>
        <button id="clearRouteDestinationButton" class="destination-close compact" type="button" aria-label="目的地とルートを解除">×</button>
      </div>
      <fieldset class="road-mode-group compact">
        <legend>道路タイプを変更</legend>
        <label><input type="radio" name="summaryRouteMode" value="highway"><span>高速優先</span></label>
        <label><input type="radio" name="summaryRouteMode" value="partial"><span>一部有料</span></label>
        <label><input type="radio" name="summaryRouteMode" value="local" checked><span>一般道</span></label>
      </fieldset>
      <strong id="routeSummaryMetrics">時間・距離</strong>
      <div class="summary-actions">
        <button id="shareRouteButton" type="button">共有</button>
        <button id="navigationButton" class="primary-action" type="button" disabled>ナビ開始</button>
      </div>
    </section>

    <section id="navigationGuidance" class="navigation-guidance" hidden aria-live="polite">
      <span id="navigationDistanceInstruction">案内を準備しています</span>
      <span id="navigationIntersectionName" class="navigation-intersection" hidden></span>
      <strong id="navigationInstruction">そのままお進みください</strong>
      <small id="navigationNextInstruction"></small>
    </section>

    <section id="rideNaviInfoPanel" class="navigation-bottom" aria-label="ナビ情報">
      <div class="navigation-destination">
        <span>目的地</span>
        <strong id="navigationDestination">目的地</strong>
      </div>
      <div class="navigation-metrics">
        <div><span>残り時間</span><strong id="navigationDurationValue">―</strong></div>
        <div><span>残り距離</span><strong id="navigationDistanceValue">―</strong></div>
        <div><span>到着予定</span><strong id="navigationEtaValue">―</strong></div>
      </div>
      <div class="navigation-bottom-actions">
        <button id="overviewButton" type="button">ルート全体</button>
        <button id="endNavigationButton" type="button">ナビ終了</button>
      </div>
    </section>

    <button id="returnToLocationButton" class="return-location" type="button" hidden>現在地に戻る</button>
    <div id="status" class="status">地図を読み込んでいます…</div>
    <button id="floatingLocationButton" class="floating-location" type="button" aria-label="現在地へ">◎</button>

    <!-- 既存の検索・GPS処理が使う非表示要素 -->
    <div class="legacy-controls" aria-hidden="true">
      <section id="controlPanel" class="control-panel is-hidden"></section>
      <button id="menuButton" type="button"></button>
      <button id="closePanelButton" type="button"></button>
      <input id="originInput" type="text" value="現在地" readonly>
      <span id="routeEndpointsSummary"></span>
      <button id="useCurrentLocationButton" type="button"></button>
      <button id="addWaypointButton" type="button"></button>
      <button id="topCurrentLocationButton" type="button"></button>
      <button id="topDestinationButton" type="button"></button>
      <button id="topAddWaypointButton" type="button"></button>
      <button id="destinationMapButton" type="button"></button>
      <div id="waypointList"></div><span id="waypointCount"></span>
      <select id="routeMode"><option value="local">一般道</option><option value="partial">一部有料</option><option value="highway">高速優先</option></select>
      <button id="clearRouteButton" type="button"></button>
      <button id="locationButton" type="button"></button>
      <input id="followToggle" type="checkbox" checked>
      <input id="trafficToggle" type="checkbox">
      <button id="voiceTestButton" type="button"></button>
      <div id="routeInfo"></div><div id="gpsInfo"></div>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="src/map.js"></script>
  <script src="app.js?v=2.5.20"></script>
</body>
</html>
