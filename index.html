<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ride Navi v1.3</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="panel">
    <div class="title-row">
      <h1>🏍 Ride Navi <small>v1.3</small></h1>
      <button id="collapseButton" class="small-button" type="button">－</button>
    </div>

    <div id="panelContent">
      <p id="message">地図をクリックして出発地を選んでください</p>

      <div class="buttons">
        <button id="trackingButton" type="button">📍 現在地追跡を開始</button>
        <button id="navigationButton" type="button">🧭 ナビモード</button>
        <button id="centerButton" type="button">🎯 現在地へ戻る</button>
        <button id="waypointButton" class="accent-button" type="button">➕ 通過地点を追加</button>
        <button id="resetButton" class="danger-button" type="button">🔄 ルートをリセット</button>
      </div>

      <section id="waypointSection">
        <div class="section-title">
          <strong>通過地点</strong>
          <span id="waypointCount">0か所</span>
        </div>
        <p class="hint">追加ボタンを押して地図をクリック。番号順に通る1本のルートになります。</p>
        <div id="waypointList" class="waypoint-list">
          <div class="empty-waypoints">まだ通過地点はありません</div>
        </div>
      </section>

      <div id="gpsInfo">
        GPS：停止中<br>
        精度：未取得<br>
        速度：未取得
      </div>

      <div id="routeInfo">
        距離：未設定<br>
        時間：未設定
      </div>
    </div>
  </div>

  <div id="navStatus">ナビモード OFF</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
