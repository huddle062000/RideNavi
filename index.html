<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>Ride Navi 2.3.1 β</title>

  <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="stylesheet" href="style.css?v=2.3.9">
</head>
<body>
  <main id="app">
    <div id="map"></div>

    <header class="top-bar">
      <div class="top-bar-heading">
        <strong>🏍 Ride Navi</strong>
        <button id="menuButton" type="button" aria-label="メニュー">☰</button>
      </div>
      <div class="top-route-controls" aria-label="ルート地点の操作">
        <span class="top-route-fixed">現在地</span>
        <button id="topDestinationButton" type="button">目的地</button>
        <button id="topAddWaypointButton" type="button" aria-label="経由地機能は準備中" disabled>＋</button>
        <button id="topMapButton" type="button">MAP</button>
      </div>
      <span id="routeEndpointsSummary">現在地 → 到着地未設定</span>
    </header>

    <section id="controlPanel" class="control-panel is-hidden">
      <div class="panel-title">
        <strong>ルートを作る</strong>
        <button id="closePanelButton" type="button" aria-label="閉じる">✕</button>
      </div>

      <input id="originInput" type="hidden" value="現在地">
      <div id="waypointList" hidden></div>

      <label class="field">
        <span>目的地</span>
        <div class="location-input-row">
          <input id="destinationInput" type="text" placeholder="例：道の駅 美山ふれあい広場">
          <button id="destinationMapButton" class="map-select-button" type="button">MAP</button>
        </div>
      </label>
<label class="field">
        <span>最初に表示する候補</span>
        <select id="routeMode">
          <option value="local">🌿 無料ルート</option>
          <option value="partial">🛣️ 一部有料</option>
          <option value="highway">🚀 高速優先</option>
        </select>
      </label>
      <button id="routeButton" class="primary" type="button">
        🧭 ルート候補を検索
      </button>

      <div class="button-grid">
        <button id="locationButton" type="button">現在地へ</button>
        <button id="clearRouteButton" type="button">ルート消去</button>
      </div>

      <label class="toggle-row">
        <input id="followToggle" type="checkbox" checked>
        <span>現在地を自動追従</span>
      </label>

      <label class="toggle-row">
        <input id="trafficToggle" type="checkbox">
        <span>渋滞情報を表示</span>
      </label>

      <button id="voiceTestButton" class="secondary" type="button">🔊 音声テスト</button>

      <div id="routeInfo" class="info-box">
        距離：未設定<br>
        時間：未設定<br>
        経由地：0か所
      </div>

      <div id="gpsInfo" class="info-box muted-box">
        GPS：未取得<br>
        精度：未取得
      </div>

      <p class="note">
        Googleが返したルート候補をそのまま表示します。道路標識・交通規制を優先してください。
      </p>
    </section>

    <div id="status" class="status">地図を読み込んでいます…</div>
    <section id="routeSummaryPanel" class="route-summary-panel" aria-label="選択中のルート情報" hidden>
      <div class="route-summary-details">
        <div class="route-summary-title">
          <span id="routeSummarySelection">選択中 ①</span>
          <strong id="routeSummaryRoadType">道路種類</strong>
          <span id="routeSummaryToll" hidden></span>
        </div>
        <span id="routeSummaryMetrics">時間・距離</span>
      </div>
      <button id="navigationButton" type="button" disabled>▶ ナビ開始</button>
    </section>
    <button id="floatingLocationButton" class="floating-location" type="button" aria-label="現在地へ">◎</button>
  </main>

  <script src="config.js"></script>
  <script src="src/map.js"></script>
<script src="app.js?v=2.3.14"></script>
</body>
</html>
