<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>Ride Navi 2.3.1 β</title>

  <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="map"></div>

    <header class="top-bar">
      <div>
        <strong>🏍 Ride Navi</strong>
        <span>2.3.1 β・地図上でルート比較</span>
      </div>
      <button id="menuButton" type="button" aria-label="メニュー">☰</button>
    </header>

    <section id="controlPanel" class="control-panel is-hidden">
      <div class="panel-title">
        <strong>ルートを作る</strong>
        <button id="closePanelButton" type="button" aria-label="閉じる">✕</button>
      </div>

      <label class="field">
        <span>出発地</span>
        <input id="originInput" type="text" placeholder="例：京都駅">
      </label>

      <button id="useCurrentLocationButton" class="secondary" type="button">
        📍 現在地を出発地にする
      </button>

      <div class="waypoint-header">
        <strong>経由地</strong>
        <span id="waypointCount">0 / 5</span>
      </div>

      <div id="waypointList"></div>

      <button id="addWaypointButton" class="secondary" type="button">
        ＋ 経由地を追加
      </button>

      <label class="field">
        <span>目的地</span>
        <input id="destinationInput" type="text" placeholder="例：道の駅 美山ふれあい広場">
      </label>
<label class="field">
        <span>最初に表示する候補</span>
        <select id="routeMode">
          <option value="highway">🚀 高速優先</option>
          <option value="partial">🛣️ 無料高速OK</option>
          <option value="local">🌿 一般道</option>
        </select>
      </label>
      <button id="routeButton" class="primary" type="button">
        🧭 3種類のルートを比較
      </button>

      <div class="button-grid">
        <button id="locationButton" type="button">現在地へ</button>
        <button id="clearRouteButton" type="button">ルート消去</button>
      </div>

      <label class="toggle-row">
        <input id="followToggle" type="checkbox" checked>
        <span>現在地を自動追従</span>
      </label>

      <label class="toggle-row">
        <input id="trafficToggle" type="checkbox">
        <span>渋滞情報を表示</span>
      </label>

      <button id="voiceTestButton" class="secondary" type="button">🔊 音声テスト</button>

      <div id="routeInfo" class="info-box">
        距離：未設定<br>
        時間：未設定<br>
        経由地：0か所
      </div>

      <div id="gpsInfo" class="info-box muted-box">
        GPS：未取得<br>
        精度：未取得
      </div>

      <p class="note">
        高速優先・無料高速OK・一般道を比較します。経由地がある場合は各種類1件になります。道路標識・交通規制を優先してください。
      </p>
    </section>

    <div id="status" class="status">地図を読み込んでいます…</div>
    <button id="floatingLocationButton" class="floating-location" type="button" aria-label="現在地へ">◎</button>
  </main>

  <script src="config.js"></script>
  <script src="src/map.js"></script>
<script src="app.js?v=2.3.2"></script>
</body>
</html>
