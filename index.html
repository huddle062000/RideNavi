<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>Ride Navi 2.0 β</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="map"></div>
    <header class="top-bar">
      <div><strong>🏍 Ride Navi</strong><span>2.0 β</span></div>
      <button id="menuButton">☰</button>
    </header>
    <section id="controlPanel" class="control-panel is-hidden">
      <div class="panel-title"><strong>操作</strong><button id="closePanelButton">✕</button></div>
      <button id="locationButton" class="primary">📍 現在地を表示</button>
      <label class="toggle-row"><input id="followToggle" type="checkbox" checked><span>現在地を自動追従</span></label>
      <label class="toggle-row"><input id="trafficToggle" type="checkbox"><span>渋滞情報を表示</span></label>
      <button id="voiceTestButton">🔊 音声テスト</button>
      <div id="gpsInfo" class="info-box">GPS：未取得<br>精度：未取得</div>
      <p class="note">この版はGoogleマップ表示・GPS・渋滞表示の土台版です。</p>
    </section>
    <div id="status" class="status">地図を読み込んでいます…</div>
    <button id="floatingLocationButton" class="floating-location">◎</button>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
